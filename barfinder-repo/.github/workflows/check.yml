name: check data and build
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate the data (fails on any error)
        run: python3 validate.py
      - name: Build the private test site
        run: python3 build_site.py --private
      - name: Check that the build is hidden from search engines
        run: |
          grep -q 'name="robots" content="noindex' public/index.html
          grep -q "Disallow: /" public/robots.txt
          grep -q "X-Robots-Tag" public/_headers
